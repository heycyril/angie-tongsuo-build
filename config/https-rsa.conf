# ==============================================================================
#  9443 - 本机站点 · RSA（不转发，直接由本机 html/rsa 提供）
#  证书：cert/rsa/cert.pem + cert/rsa/key.pem
# ==============================================================================
server {
    listen       9443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_certificate      ../cert/rsa/cert.pem;
    ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL_RSA_SITE:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Server-Role "site-rsa" always;
    add_header X-Listen-Port "9443" always;

    root   html/rsa;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
