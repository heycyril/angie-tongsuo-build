server {
    listen 9443 ssl;
    server_name yourdomain.com; # 需修改为对应的网站域名

    include server-security.conf;

    # 启用 NTLS（保留原配置行为；若此站点只走 RSA 可改为 off）
    ssl_ntls on;

    # 配置 RSA 算法证书
    ssl_certificate      cert/rsa/cert.pem;
    ssl_certificate_key  cert/rsa/key.pem;

    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;

    # TLSv1/1.1 已废弃，仅保留 TLSv1.2+
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root html;
        index index.html index.htm;
    }
}
