# ============================================
# HTTP 安全配置 - 防护常见攻击（收紧版）
# 说明：只拦截"具备明确攻击特征"的请求，
#       不再因为 URL 里出现 select/update/delete 等单词就误杀正常业务接口。
#       注意：$request_uri 是未解码的原始 URI，所以规则同时匹配编码形式。
# ============================================

# 1. 恶意 User-Agent 检测
#    只封扫描器/漏洞工具；不再封 curl/python/perl/Wget 等合法开发工具
map $http_user_agent $bad_agent {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|zgrab|zmap|acunetix|netsparker|nessus|openvas|wpscan|dirbuster|gobuster|dirb|wfuzz|hydra|medusa|appscan|w3af|skipfish|arachni|vega|webscarab|paros|grabber|havij|pangolin|jsession)" 1;
    # 完全为空的 UA（大量爬虫/扫描器特征）
    "~^$" 1;
}

# 2. 恶意请求 URI 检测 —— 仅匹配真实攻击特征
map $request_uri $block_attack {
    default 0;

    # ---- SQL 注入 ----
    # union [all] select（含 %20、+、注释符等空白变体）
    "~*union(\s|\+|%20|/\*.*\*/)+(all(\s|\+|%20)+)?select" 1;
    # ' or 1=1 / " and "a"="a 之类的恒真条件
    "~*(%27|'|%22)(\s|\+|%20)*(or|and)(\s|\+|%20)+[\w'\"%]+=(%27|'|%22)?[\w%]" 1;
    # 危险函数与文件读写
    "~*(\bload_file\b|\binto(\s|\+|%20)+(out|dump)file\b|\bbenchmark(\s|\+|%20)*\(|\bsleep(\s|\+|%20)*\(|%2f%2a)" 1;
    # 堆叠查询：分号后跟写操作（正常 URL 一般不会出现 ;drop / ;delete from）
    "~*;(\s|\+|%20)*(drop|truncate|alter|exec|execute|delete(\s|\+|%20)+from|update(\s|\+|%20)+\w+(\s|\+|%20)+set)\b" 1;
    # xp_cmdshell 等 MSSQL 命令执行
    "~*(xp_cmdshell|sp_oacreate|master\.\.xp_)" 1;

    # ---- XSS ----
    "~*(<(\s|\+|%20)*script|%3c(\s)*script|javascript(\s)*:|%3a?javascript|on(error|load|click|mouseover)(\s|\+|%20)*=)" 1;

    # ---- 路径穿越 / 敏感文件 ----
    "~*(\.\./|\.\.\\|%2e%2e%2f|%2e%2e/|\.\.%2f|%252e%252e)" 1;
    "~*(/etc/passwd|/etc/shadow|/proc/self/environ|boot\.ini|win\.ini|/\.git/|/\.env\b|/\.svn/)" 1;

    # ---- 命令执行 / WebShell ----
    "~*(\b(eval|assert|system|passthru|shell_exec|popen|proc_open)(\s|\+|%20)*\(|base64_decode(\s|\+|%20)*\(|php://input|data://text|expect://)" 1;
    # 直接在 URL 里执行系统命令
    "~*[;|`](\s)*(id|whoami|uname|cat(\s|\+|%20)+/etc|ls(\s|\+|%20)+-la)\b" 1;
}

# 3. IP 访问控制
geo $allowed_ip {
    default 0;
    127.0.0.1 1;
    ::1 1;          # localhost 走 IPv6 时的本机探活，必须加，否则空 UA 会被 403
    # 负载均衡器/监控探活网段（无 UA 探活必须在此放行）
    # 100.64.0.0/10 1;   # 阿里云 SLB 探活网段
    # 10.0.0.0/8 1;
    # 192.168.0.0/16 1;
    # 172.16.0.0/12 1;
}

# 4. 请求频率限制区域
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
limit_req_zone $server_name zone=req_limit_per_server:10m rate=100r/s;

# 5. 连接数限制
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn_zone $server_name zone=conn_limit_per_server:10m;

# 6. 连接超时设置
client_body_timeout 60s;
client_header_timeout 60s;
keepalive_timeout 65s;
send_timeout 60s;

# 7. 客户端请求限制
client_max_body_size 10m;
client_body_buffer_size 128k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;

# 8. 安全响应头（对客户端）
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 9. 隐藏版本信息
server_tokens off;

# 10. 其他安全设置
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# 11. 上游 SSL 设置
proxy_ssl_session_reuse off;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
