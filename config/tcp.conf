# ==============================================================================
#  四层 TCP 转发（在 angie.conf 的 stream { } 中 include）
# ==============================================================================
# 四层 TCP 转发：17443 -> 本机 HTTP 后端 18080
# 该端口本身不终止 TLS，浏览器应使用 http://IP:17443/，不是 https://
server {
    listen                17443;
    proxy_pass            127.0.0.1:18080;
    proxy_connect_timeout 5s;
}
