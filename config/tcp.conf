# ==============================================================================
#  四层 TCP 转发（在 angie.conf 的 stream { } 中 include）
# ==============================================================================
upstream mgweb {
    server  1.13.128.92:443  weight=5 max_fails=3 fail_timeout=30s;
}

server {
    listen                17443;
    proxy_pass            mgweb;
    proxy_connect_timeout 500s;
}
