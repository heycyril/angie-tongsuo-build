# ==============================================================================
#  国密（SM2/NTLS）
#    8443 - SM2 双证书站点
#    7443 - SM2 反向代理（原 proxy-sm2.conf 合并于此）
#  证书路径按配置文件所在目录解析，故用 ../cert/ 指向安装根目录
# ==============================================================================

upstream sm2-server {
    server  111.13.118.92:443  weight=5 max_fails=3 fail_timeout=30s;
    #server 8.141.4.199:80     weight=5 max_fails=3 fail_timeout=30s;
}

# ------------------------------------------------------------------------------
# 8443：SM2 双证书（签名证书 + 加密证书）
# ------------------------------------------------------------------------------
server {
    listen       8443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_ntls on;

    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key ../cert/sm2/server_enc.key;

    # 双向认证（可选）
    #ssl_client_certificate ../cert/sm2/ca.crt;
    #ssl_verify_client on;

    # 与 RSA 证书并存（双栈）时可一并配置
    #ssl_certificate      ../cert/rsa/cert.pem;
    #ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root   html;
        index  index.html index.htm;
    }
}

# ------------------------------------------------------------------------------
# 7443：SM2 反向代理（上游为 443/TLS，必须用 https:// 并开启 SNI）
# ------------------------------------------------------------------------------
server {
    listen       7443 ssl;
    server_name  127.0.0.1;   # 改为实际域名

    include server-security.conf;

    ssl_ntls on;

    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key ../cert/sm2/server_enc.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-SHA:AES128-GCM-SHA256:AES128-SHA256:AES128-SHA:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:AES256-GCM-SHA384:AES256-SHA256:AES256-SHA:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 本 server 定义了 add_header 后不再继承 http 级响应头，需显式补齐
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass              https://sm2-server;
        proxy_ssl_server_name   on;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_cookie_path / "/; httponly; secure; SameSite=Lax";
    }
}
