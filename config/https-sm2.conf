# ==============================================================================
#  8443 - 本机站点 · 国密 SM2（不转发，直接由本机 html/sm2 提供）
#  证书：cert/sm2/server_sign.* + cert/sm2/server_enc.*（双证书必须成对）
# ==============================================================================
server {
    listen       8443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_ntls on;

    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key ../cert/sm2/server_enc.key;

    # 双向认证（可选）
    #ssl_client_certificate ../cert/sm2/ca.crt;
    #ssl_verify_client on;

    ssl_session_cache    shared:SSL_SM2_SITE:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECC-SM2-SM4-GCM-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-CBC-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Server-Role "site-sm2" always;
    add_header X-Listen-Port "8443" always;

    root   html/sm2;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
