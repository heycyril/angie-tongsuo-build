# ==============================================================================
#  18080 - HTTP 明文站点（所有代理端口的转发目标，即后端）
# ==============================================================================
server {
    listen       18080;
    server_name  _;

    include server-security.conf;

    root   html/http;
    index  index.html;

    add_header X-Server-Role "http-backend" always;
    add_header X-Listen-Port "18080" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
