# ==============================================================================
#  80 端口明文站点
# ==============================================================================
server {
    listen       80;
    server_name  localhost;

    include server-security.conf;

    location / {
        root   html;
        index  index.html index.htm;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
