# ==============================================================================
#  37443 - RSA 反向代理（上游为 443/TLS，必须用 https:// 并开启 SNI）
# ==============================================================================
upstream rsa-server {
    server  111.13.118.92:443  weight=5 max_fails=3 fail_timeout=30s;
    #server 8.141.4.199:80     weight=5 max_fails=3 fail_timeout=30s;
}

server {
    listen       37443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_certificate      ../cert/rsa/cert.pem;
    ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL_RSA_PROXY:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 本 server 定义了 add_header 后不再继承 http 级响应头，需显式补齐
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass              https://rsa-server;
        proxy_ssl_server_name   on;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_cookie_path / "/; httponly; secure; SameSite=Lax";
    }
}
