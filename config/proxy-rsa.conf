# ==============================================================================
#  37443 - 代理 · RSA → 转发到本机 127.0.0.1:18080
#  证书：cert/rsa/cert.pem + cert/rsa/key.pem
# ==============================================================================
upstream backend_18080_rsa {
    server   127.0.0.1:18080;
    keepalive 16;
}

server {
    listen       37443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_certificate      ../cert/rsa/cert.pem;
    ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL_RSA_PROXY:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Server-Role  "proxy-rsa" always;
    add_header X-Listen-Port  "37443" always;
    add_header X-Proxy-Target "127.0.0.1:18080" always;

    location = / {
        root      html/proxy-rsa;
        try_files /index.html =404;
    }

    location / {
        proxy_pass              http://backend_18080_rsa;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port  $server_port;
        proxy_connect_timeout   5s;
        proxy_read_timeout      60s;
    }
}
