# ==============================================================================
#  server 级安全配置（在每个 server { } 内 include 一次）
#  依赖 angie.conf 中定义的：$allowed_ip / $bad_agent / $block_attack
#                            req_limit_per_ip 限流区域
# ==============================================================================

# 0. 健康检查端点：精确匹配优先，不做 UA/IP 判定（LB、K8s、监控探活统一用它）
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# 1. 本机/白名单直接放行（break 短路，后续拦截不再判断）
if ($allowed_ip) {
    break;
}

# 2. 恶意 UA / 攻击特征拦截
if ($bad_agent) {
    return 403;
}
if ($block_attack) {
    return 403;
}

# 3. 应用限流（突发 20，超出直接 503）
limit_req zone=req_limit_per_ip burst=20 nodelay;

# 4. 路径穿越
location ~ \.\./ {
    return 403;
}

# 5. 敏感后缀（下载站如需放行 zip/tar.gz/sql 等，请在此注释掉对应项）
location ~* \.(env|git|svn|htaccess|htpasswd|bak|log|sql|zip|tar\.gz|ini|conf)$ {
    return 403;
}

# 6. 隐藏文件
location ~ /\. {
    return 404;
}
