# ==========================================
#  Angie/Nginx 业务安全配置 (server块专用)
#  使用方法：在任意业务 server { ... } 块中引入
#  依赖：http-security.conf 中定义的 $allowed_ip / $bad_agent / $block_attack
#        以及 req_limit_per_ip 限流区域
# ==========================================

# 解决后端 SSL 握手报错（针对当前站点的代理行为）
proxy_ssl_session_reuse off;

# 0. 健康检查端点：精确匹配优先于其他 location，且不做 UA/IP 判定
#    LB / K8s / 监控探活统一用 http(s)://站点/healthz
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# 1. 本机/白名单直接放行（break 短路，后续拦截规则不再判断）
if ($allowed_ip) {
    break;
}

# 2. 执行全局定义的拦截规则
if ($bad_agent) {
    return 403;
}
if ($block_attack) {
    return 403;
}

# 3. 应用全局限流规则
#    burst=20 允许突发 20 个请求，nodelay 表示超出限制直接返回 503
limit_req zone=req_limit_per_ip burst=20 nodelay;

# 4. 拦截 URL 路径穿越攻击 (例如 ../ 或 %2f)
location ~ \.\./ {
    return 403;
}

# 5. 拦截常见敏感文件与后缀访问 (.git, .env, .sql, .bak 等)
location ~* \.(env|git|svn|htaccess|htpasswd|bak|log|sql|zip|tar\.gz|ini|conf)$ {
    return 403;
}

# 6. 拦截隐藏文件访问 (以 . 开头的文件)
location ~ /\. {
    return 404;
}
