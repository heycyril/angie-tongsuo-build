# ==============================================================================
#  47443 - 自适应代理：同一端口按客户端 ClientHello 自动选择国密或国际算法
#    · 客户端支持 SM2（国密浏览器 / 支持 NTLS 的客户端） -> 使用 SM2 双证书
#    · 国际客户端（Chrome/curl/Firefox 等）              -> 使用 RSA 证书
#  前置条件：Angie 编译时带 --with-ntls，且 Tongsuo 启用 enable-ntls
# ==============================================================================
upstream adaptive-server {
    server  111.13.118.92:443  weight=5 max_fails=3 fail_timeout=30s;
    #server 8.141.4.199:80     weight=5 max_fails=3 fail_timeout=30s;
}

server {
    listen       47443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    # 开启国密 NTLS，同端口兼容国际 TLS
    ssl_ntls on;

    # 国密证书对：签名证书 + 加密证书（必须成对出现）
    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key  ../cert/sm2/server_enc.key;

    # 国际证书：RSA
    ssl_certificate      ../cert/rsa/cert.pem;
    ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL_ADAPTIVE:1m;
    ssl_session_timeout  5m;

    # 同时列出国密与国际套件，由客户端能力决定实际协商结果
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 本 server 定义了 add_header 后不再继承 http 级响应头，需显式补齐
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass              https://adaptive-server;
        proxy_ssl_server_name   on;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        # 便于上游区分本次请求走的是国密还是国际套件
        proxy_set_header X-SSL-Cipher      $ssl_cipher;
        proxy_set_header X-SSL-Protocol    $ssl_protocol;
        proxy_cookie_path / "/; httponly; secure; SameSite=Lax";
    }
}
