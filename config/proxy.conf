# ==============================================================================
#  47443 - 代理 · 自适应（同一端口自动协商国密 SM2 / 国际 RSA）
#          → 转发到本机 127.0.0.1:18080
#  证书：同时加载 cert/sm2 双证书 与 cert/rsa 证书，由客户端能力选择
# ==============================================================================
upstream backend_18080_adaptive {
    server   127.0.0.1:18080;
    keepalive 16;
}

server {
    listen       47443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    # 开启 NTLS，同端口兼容国际 TLS
    ssl_ntls on;

    # 国密证书对：签名 + 加密（必须成对，且写在前面优先协商）
    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key  ../cert/sm2/server_enc.key;

    # 国际证书：RSA
    ssl_certificate      ../cert/rsa/cert.pem;
    ssl_certificate_key  ../cert/rsa/key.pem;

    ssl_session_cache    shared:SSL_ADAPTIVE:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Server-Role  "proxy-adaptive" always;
    add_header X-Listen-Port  "47443" always;
    add_header X-Proxy-Target "127.0.0.1:18080" always;

    location = / {
        root      html/adaptive;
        try_files /index.html =404;
    }

    location / {
        proxy_pass              http://backend_18080_adaptive;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port  $server_port;
        # 实际协商到的套件/协议，便于上游区分国密与国际
        proxy_set_header        X-SSL-Cipher      $ssl_cipher;
        proxy_set_header        X-SSL-Protocol    $ssl_protocol;
        proxy_connect_timeout   5s;
        proxy_read_timeout      60s;
    }
}
