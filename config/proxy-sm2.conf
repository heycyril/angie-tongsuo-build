upstream sm2-server {
        server  111.13.118.92:443  weight=5 max_fails=3 fail_timeout=30s;
        #server  8.141.4.199:80  weight=5 max_fails=3 fail_timeout=30s;
}

server {
    listen 7443 ssl;
    server_name 127.0.0.1; #需修改为对应的网站域名
    
    # 启用NTLS。
    ssl_ntls on;
      
    # 配置国密算法签名证书和加密证书（服务端应使用 server_* 证书）
    ssl_certificate      cert/sm2/server_sign.crt cert/sm2/server_enc.crt;
    ssl_certificate_key  cert/sm2/server_sign.key cert/sm2/server_enc.key;
    # 配置RSA算法证书
    #ssl_certificate      cert/rsa/cert.pem;
    #ssl_certificate_key  cert/rsa/key.pem; 
    
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;    
    
    # 配置加密套件 # 确保下面配置中有这两个套件即可ssl_ciphers "ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3";
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-SHA:AES128-GCM-SHA256:AES128-SHA256:AES128-SHA:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:AES256-GCM-SHA384:AES256-SHA256:AES256-SHA:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;        
    #ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-SM2-SM4-GCM-SM3:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!MD5:!PSK:!aECDH:!CBC';

    ssl_protocols TLSv1.2 TLSv1.3;    
    ssl_prefer_server_ciphers on;
    #（可选）启用 HSTS 强制 HTTPS 访问，进一步提升安全性
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
       
    location / {
            # 上游是 443(TLS) 端口，必须用 https://，否则会把明文 HTTP 发给 TLS 端口导致 400
            proxy_pass https://sm2-server;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse off;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cookie_path / "/; httponly; secure; SameSite=Lax";

    }   
}   

