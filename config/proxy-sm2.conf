# ==============================================================================
#  27443 - 代理 · 国密 SM2 → 转发到本机 127.0.0.1:18080
#  证书：cert/sm2/server_sign.* + cert/sm2/server_enc.*
#  访问 / 显示本端口说明页，其余路径全部转发
# ==============================================================================
upstream backend_18080 {
    server   127.0.0.1:18080;
    keepalive 16;
}

server {
    listen       27443 ssl;
    server_name  yourdomain.com;   # 改为实际域名

    include server-security.conf;

    ssl_ntls on;

    ssl_certificate      ../cert/sm2/server_sign.crt ../cert/sm2/server_enc.crt;
    ssl_certificate_key  ../cert/sm2/server_sign.key ../cert/sm2/server_enc.key;

    ssl_session_cache    shared:SSL_SM2_PROXY:1m;
    ssl_session_timeout  5m;

    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Server-Role  "proxy-sm2" always;
    add_header X-Listen-Port  "27443" always;
    add_header X-Proxy-Target "127.0.0.1:18080" always;

    # 主页：说明本端口用途，不转发
    location = / {
        root      html/proxy-sm2;
        try_files /index.html =404;
    }

    location / {
        proxy_pass              http://backend_18080;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Port  $server_port;
        proxy_connect_timeout   5s;
        proxy_read_timeout      60s;
    }
}
