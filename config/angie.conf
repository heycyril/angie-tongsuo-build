user  nobody;
# 按 CPU 核数自动设置 worker 数（原为固定 1，多核机器上浪费性能）
worker_processes  auto;

error_log  logs/error.log  warn;
pid        logs/angie.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    # 包含常见的安全配置
    include http-security.conf;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    # keepalive_timeout / client_max_body_size 等统一在 http-security.conf 中设置，避免重复定义

    # 开启动态压缩（原配置被注释）
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_proxied any;

    include http-server.conf;
    include https-sm2.conf;
    include https-rsa.conf;
    include proxy-sm2.conf;
}

stream {
    include proxy_tcp_mg.conf;
}
