# ==============================================================================
#  Angie 主配置（Angie 1.12.4 + Tongsuo 8.5.0 国密SSL）
#  结构：全局 -> events -> http(站点) -> stream(四层转发)
#  说明：map / geo / limit_req_zone 只能位于 http 级，故在此声明；
#        具体拦截逻辑统一放在 server-security.conf。
# ==============================================================================

user  nobody;
worker_processes  auto;

error_log  logs/error.log  warn;
pid        logs/angie.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Lua 模块搜索路径由 start.sh 通过 LUA_PATH / LUA_CPATH 环境变量提供
    # （resty.core 在 http 块初始化时加载，早于运行期变量解析）

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  logs/access.log  main;

    # ==========================================================================
    #  一、安全原语（http 级，供 server-security.conf 使用）
    # ==========================================================================

    # 1. 恶意 User-Agent 识别（只封扫描器；curl/python/wget 等正常放行）
    map $http_user_agent $bad_agent {
        default 0;
        "~*(sqlmap|nikto|nmap|masscan|zgrab|zmap|acunetix|netsparker|nessus|openvas|wpscan|dirbuster|gobuster|dirb|wfuzz|hydra|medusa|appscan|w3af|skipfish|arachni|vega|webscarab|paros|grabber|havij|pangolin)" 1;
        "~^$" 1;   # 空 UA
    }

    # 2. 攻击特征识别（只匹配真实注入特征，避免误杀 /user/update 之类正常路径）
    map $request_uri $block_attack {
        default 0;

        # ---- SQL 注入 ----
        "~*union(\s|\+|%20|/\*.*\*/)+(all(\s|\+|%20)+)?select" 1;
        "~*(%27|'|%22)(\s|\+|%20)*(or|and)(\s|\+|%20)+[\w'\"%]+=(%27|'|%22)?[\w%]" 1;
        "~*(\bload_file\b|\binto(\s|\+|%20)+(out|dump)file\b|\bbenchmark(\s|\+|%20)*\(|\bsleep(\s|\+|%20)*\(|%2f%2a)" 1;
        "~*;(\s|\+|%20)*(drop|truncate|alter|exec|execute|delete(\s|\+|%20)+from|update(\s|\+|%20)+\w+(\s|\+|%20)+set)\b" 1;
        "~*(xp_cmdshell|sp_oacreate|master\.\.xp_)" 1;

        # ---- XSS ----
        "~*(<(\s|\+|%20)*script|%3c(\s)*script|javascript(\s)*:|%3a?javascript|on(error|load|click|mouseover)(\s|\+|%20)*=)" 1;

        # ---- 路径穿越 / 敏感文件 ----
        "~*(\.\./|\.\.\\|%2e%2e%2f|%2e%2e/|\.\.%2f|%252e%252e)" 1;
        "~*(/etc/passwd|/etc/shadow|/proc/self/environ|boot\.ini|win\.ini|/\.git/|/\.env\b|/\.svn/)" 1;

        # ---- 命令执行 / WebShell ----
        "~*(\b(eval|assert|system|passthru|shell_exec|popen|proc_open)(\s|\+|%20)*\(|base64_decode(\s|\+|%20)*\(|php://input|data://text|expect://)" 1;
        "~*[;|`](\s)*(id|whoami|uname|cat(\s|\+|%20)+/etc|ls(\s|\+|%20)+-la)\b" 1;
    }

    # 3. IP 白名单（命中后跳过所有拦截，用于本机探活）
    geo $allowed_ip {
        default 0;
        127.0.0.1 1;
        ::1 1;
        # 100.64.0.0/10 1;   # 阿里云 SLB 探活网段
        # 10.0.0.0/8 1;
        # 192.168.0.0/16 1;
        # 172.16.0.0/12 1;
    }

    # 4. 限流 / 限连区域
    limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m   rate=10r/s;
    limit_req_zone  $server_name       zone=req_limit_per_server:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_zone $server_name       zone=conn_limit_per_server:10m;

    # 5. 超时与请求体限制
    client_body_timeout        60s;
    client_header_timeout      60s;
    keepalive_timeout          65s;
    send_timeout               60s;
    client_max_body_size       10m;
    client_body_buffer_size    128k;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;

    # 6. 安全响应头 / 版本隐藏
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 7. 上游 TLS 默认参数
    proxy_ssl_session_reuse off;
    proxy_ssl_protocols     TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers       ECC-SM2-SM4-CBC-SM3:ECDHE-SM2-WITH-SM4-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:!aNULL:!eNULL:!RC4:!EXPORT:!DES:!3DES:!MD5:!DSS:!PKS;

    # ==========================================================================
    #  二、传输与压缩
    # ==========================================================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ==========================================================================
    #  三、站点（每个文件一个职责）
    # ==========================================================================
    include http.conf;        # 80    明文站点
    include https-rsa.conf;   # 9443  RSA 国密双栈站点
    include https-sm2.conf;   # 8443  SM2 TLS 站点
    include proxy-sm2.conf;   # 27443 SM2 反向代理
    include proxy-rsa.conf;   # 37443 RSA 反向代理
    include proxy.conf;       # 47443 自适应（SM2/RSA 同端口）代理
}

# ==============================================================================
#  四、四层转发（stream）
# ==============================================================================
stream {
    include tcp.conf;         # 17443 TCP 转发
}
